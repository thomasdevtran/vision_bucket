name: Publish portfolio demo

on:
  push:
    branches: [codex/portfolio-demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Build the no-sign-in demo
        run: |
          test -n "$REACT_APP_API_URL" || { echo "Set the DEMO_API_URL repository variable first."; exit 1; }
          npm run build:demo
        env:
          CI: true
          PUBLIC_URL: ${{ steps.pages.outputs.base_path }}
          REACT_APP_API_URL: ${{ vars.DEMO_API_URL }}
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/codex/portfolio-demo'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
